# Clippy lint *configuration values* (not levels).
# Lint levels (warn/allow/deny) live in [workspace.lints.clippy] in Cargo.toml.
#
# This file configures lints that accept extra parameters — things Cargo.toml
# cannot express with a plain level string.
#
# References:
#   https://doc.rust-lang.org/clippy/configuration.html
#   https://rust-lang.github.io/rust-clippy/master/

# ---------------------------------------------------------------------------
# doc_markdown — exempt domain-specific terms from spelling checks
# ---------------------------------------------------------------------------
# Add any project-specific proper nouns, acronyms, or crate names that
# doc_markdown would otherwise flag as needing backtick-quoting.
#
# ".." preserves Clippy's built-in default list (crates.io, GitHub, …).
# Without it, ALL defaults are dropped and only your entries are recognised.
#
# TODO: add your project's domain-specific terms, e.g.:
#   doc-valid-idents = ["..", "MyProtocol", "OpenAPI", "gRPC"]
doc-valid-idents = [".."]

# ---------------------------------------------------------------------------
# disallowed-types — ban raw types in favour of project-approved wrappers
# ---------------------------------------------------------------------------
# Use this once you've written an abstraction layer (e.g. `crates/profilectl-fs`)
# that wraps std/tokio. Banning the raw type forces all code — including internal
# workspace crates — to go through your facade, so callers can't tell whether the
# implementation uses std, tokio, or something hand-rolled.
#
# How it works: any `use std::fs::File` or `let f: std::fs::File = …` becomes a
# clippy error with the message in `reason`.
#
# Uncomment and adapt when your facade crate is ready:
# disallowed-types = [
#     # Sync IO — route through your fs abstraction instead.
#     { path = "std::fs::File",        reason = "use profilectl::fs::File — see crates/profilectl-fs" },
#     { path = "std::fs::OpenOptions", reason = "use profilectl::fs::OpenOptions — see crates/profilectl-fs" },
#
#     # Async IO — same facade, just the tokio surface.
#     { path = "tokio::fs::File",        reason = "use profilectl::fs::File — see crates/profilectl-fs" },
#     { path = "tokio::fs::OpenOptions", reason = "use profilectl::fs::OpenOptions — see crates/profilectl-fs" },
# ]

# ---------------------------------------------------------------------------
# disallowed-methods — ban specific free functions for the same reason
# ---------------------------------------------------------------------------
# Companion to disallowed-types: bans the convenience free functions that bypass
# constructing a typed handle (e.g. `std::fs::read_to_string` never touches File
# directly, so disallowed-types alone won't catch it).
#
# Uncomment and adapt when your facade crate is ready:
# disallowed-methods = [
#     { path = "std::fs::read",            reason = "use profilectl::fs::read — see crates/profilectl-fs" },
#     { path = "std::fs::read_to_string",  reason = "use profilectl::fs::read_to_string — see crates/profilectl-fs" },
#     { path = "std::fs::write",           reason = "use profilectl::fs::write — see crates/profilectl-fs" },
#
#     { path = "tokio::fs::read",           reason = "use profilectl::fs::read — see crates/profilectl-fs" },
#     { path = "tokio::fs::read_to_string", reason = "use profilectl::fs::read_to_string — see crates/profilectl-fs" },
#     { path = "tokio::fs::write",          reason = "use profilectl::fs::write — see crates/profilectl-fs" },
# ]

# ---------------------------------------------------------------------------
# msrv — minimum supported Rust version for MSRV-gated lints
# ---------------------------------------------------------------------------
# Clippy uses this to skip linting suggestions that require a newer Rust than
# your project supports. Keep in sync with rust-version in Cargo.toml.
#
# TODO: update if you change [workspace.package].rust-version in Cargo.toml.
msrv = "1.85"
